<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scentonish - Cart</title>
<link rel="shortcut icon" href="https://i.ibb.co/YF8hjb6F/image.png" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#faf8f5;
  --ink:#2a1f1a;
  --ink2:#5a4a42;
  --accent:#a8413a;
  --accent2:#c85a4a;
  --border:#e8ddd5;
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --shadow2:0 12px 40px rgba(0,0,0,.12);
  --radius:16px;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--ink);
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 5%;
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-weight:900;
  font-size:1.4rem;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  text-decoration:none;
  color:var(--ink2);
  font-weight:600;
}

.nav-links a.active{
  color:var(--accent);
}

.cart-icon{
  position:relative;
  font-size:1.3rem;
}

.badge{
  position:absolute;
  top:-6px;
  right:-10px;
  background:var(--accent);
  color:#fff;
  font-size:.7rem;
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px 20px;
}

.hero h1{
  font-size:2.5rem;
  font-weight:900;
}

.hero p{
  color:var(--ink2);
  margin-top:8px;
}

/* LAYOUT */
.container{
  max-width:1200px;
  margin:auto;
  padding:30px 5%;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:30px;
}

/* CART ITEMS */
.cart-items{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  display:flex;
  gap:16px;
  align-items:center;
  box-shadow:var(--shadow);
}

.card img{
  width:100px;
  height:100px;
  object-fit:contain;
  border-radius:12px;
  background:#faf8f5;
}

.info{
  flex:1;
}

.name{
  font-weight:700;
  margin-bottom:6px;
}

.price{
  color:var(--accent);
  font-weight:800;
  margin-bottom:10px;
}

.qty{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn{
  width:32px;
  height:32px;
  border:none;
  background:#eee;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.btn:hover{
  background:var(--accent);
  color:#fff;
}

.remove{
  margin-left:auto;
  background:#ffe5e5;
  border:none;
  padding:6px 10px;
  border-radius:8px;
  color:#b91c1c;
  cursor:pointer;
  font-weight:700;
}

/* SUMMARY */
.summary{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  height:fit-content;
  position:sticky;
  top:90px;
  box-shadow:var(--shadow);
}

.summary h3{
  margin-bottom:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}

.checkout{
  display:block;
  text-align:center;
  margin-top:20px;
  padding:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  text-decoration:none;
  border-radius:12px;
  font-weight:700;
  transition:.3s;
}

.checkout:hover{
  transform:translateY(-3px);
}

/* EMPTY */
.empty{
  text-align:center;
  padding:60px;
  color:var(--ink2);
  border:1px dashed var(--border);
  border-radius:16px;
  background:#fff;
}

/* MOBILE */
@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }

  .card{
    flex-direction:column;
    align-items:flex-start;
  }

  .card img{
    width:100%;
    height:200px;
  }
}
.continue-btn{
  display:inline-block;
  margin-top:16px;
  padding:12px 18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  text-decoration:none;
  border-radius:12px;
  font-weight:700;
  transition:.3s;
}

.continue-btn:hover{
  transform:translateY(-3px);
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">Scentonish</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html" class="active">Cart</a>
  </div>

  <div class="cart-icon">🛒
    <span class="badge" id="badge">0</span>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>Your Cart</h1>
  <p>Review your selected fragrances before checkout</p>
</div>

<!-- MAIN -->
<div class="container">

  <div class="cart-items" id="cartItems"></div>

  <div class="summary">
    <h3>Order Summary</h3>

    <div class="row">
      <span>Items</span>
      <strong id="items">0</strong>
    </div>

    <div class="row">
      <span>Total</span>
      <strong id="total">Rs. 0</strong>
    </div>

    <a href="checkout.html" class="checkout">Proceed to Checkout</a>
  </div>

</div>

<script>
  
/* =======================
   GET CART
======================= */
function getCart(){
  return JSON.parse(localStorage.getItem('cart')) || [];
}

/* =======================
   SAVE CART
======================= */
function saveCart(cart){
  localStorage.setItem('cart', JSON.stringify(cart));
}

/* =======================
   RENDER CART / SUMMARY
======================= */
function render(){

  const cart = getCart();

  const box = document.getElementById('itemsBox') || document.getElementById('cartItems');
  const totalEl = document.getElementById('total') || document.getElementById('summaryTotal');
  const itemsEl = document.getElementById('items') || document.getElementById('summaryItems');
  const badge = document.getElementById('badge') || document.getElementById('cartBadge');

  if(!box) return;

  let total = 0;

  if(cart.length === 0){

    box.innerHTML = `
      <div style="
        text-align:center;
        padding:50px;
        border:1px dashed #ddd;
        border-radius:12px;
        background:#fff;
        color:#777;
      ">
        🛒 Your cart is empty
        <br><br>
        <a href="shop.html" style="
          display:inline-block;
          margin-top:10px;
          padding:10px 16px;
          background:#a8413a;
          color:#fff;
          border-radius:10px;
          text-decoration:none;
        ">Continue Shopping</a>
      </div>
    `;

    if(totalEl) totalEl.textContent = "Rs. 0";
    if(itemsEl) itemsEl.textContent = "0";
    if(badge) badge.textContent = "0";

    return;
  }

  box.innerHTML = cart.map((p,i)=>{

    let qty = p.qty || 1;
    total += p.price * qty;

    return `
      <div style="
        display:flex;
        align-items:center;
        gap:12px;
        padding:12px;
        border:1px solid #eee;
        border-radius:12px;
        margin-bottom:10px;
        background:#fff;
        font-family:'Plus Jakarta Sans',sans-serif;
      ">

        <!-- IMAGE -->
        <img src="${p.img}" style="
          width:200px;
          height:200px;
          object-fit:contain;
          border-radius:10px;
          background:#f7f7f7;
          padding:5px;
        ">

        <!-- INFO -->
        <div style="flex:1">

          <div style="font-weight:700;font-size:.85rem;">
            ${p.name}
          </div>

          <div style="font-size:.75rem;color:#777;">
            Rs. ${p.price.toLocaleString()}
          </div>

          <!-- QTY -->
          <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">

            <button onclick="changeQty(${i},-1)" style="
              width:28px;height:28px;border:none;
              background:#eee;border-radius:6px;
              font-weight:700;cursor:pointer;
            ">−</button>

            <span style="font-weight:700;">${qty}</span>

            <button onclick="changeQty(${i},1)" style="
              width:28px;height:28px;border:none;
              background:#eee;border-radius:6px;
              font-weight:700;cursor:pointer;
            ">+</button>

            <button onclick="removeItem(${i})" style="
              margin-left:10px;
              background:#ffe5e5;
              color:#b91c1c;
              border:none;
              padding:6px 10px;
              border-radius:8px;
              cursor:pointer;
              font-weight:700;
            ">
              Remove
            </button>

          </div>

        </div>

        <!-- PRICE -->
        <div style="
          font-weight:800;
          color:#a8413a;
        ">
          Rs. ${(p.price * qty).toLocaleString()}
        </div>

      </div>
    `;
  }).join('');

  if(totalEl) totalEl.textContent = "Rs. " + total.toLocaleString();
  if(itemsEl) itemsEl.textContent = cart.length;
  if(badge) badge.textContent = cart.length;

}

/* =======================
   ADD QTY
======================= */
function changeQty(i,val){

  let cart = getCart();

  if(!cart[i]) return;

  cart[i].qty = (cart[i].qty || 1) + val;

  if(cart[i].qty <= 0){
    cart.splice(i,1);
  }

  saveCart(cart);
  render();
}

/* =======================
   REMOVE ITEM
======================= */
function removeItem(i){

  let cart = getCart();

  cart.splice(i,1);

  saveCart(cart);
  render();
}

/* =======================
   INIT
======================= */
document.addEventListener('DOMContentLoaded', render);

</script>
</body>
</html>
