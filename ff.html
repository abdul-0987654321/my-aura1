<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image URL to GIF Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.4.5/gifshot.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result-container {
            margin-top: 20px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .loader { display: none; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>URL to GIF Converter</h2>
    <p>Converts a static image into a GIF format.</p>
    <input type="text" id="urlInput" value="https://i.ibb.co/fznWBxnB/efb6641dd9cb.png" placeholder="Paste image URL here...">
    <button onclick="convertToGif()">Create GIF</button>
    
    <div id="loader" class="loader">Processing...</div>
    
    <div id="result-container">
        <h3>Result:</h3>
        <div id="output"></div>
        <a id="downloadBtn" style="display:none;">
            <button style="background-color: #28a745; margin-top: 10px;">Download GIF</button>
        </a>
    </div>
</div>

<script>
    function convertToGif() {
        const imageUrl = document.getElementById('urlInput').value;
        const outputDiv = document.getElementById('output');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!imageUrl) return alert("Please enter a URL");

        loader.style.display = 'block';
        outputDiv.innerHTML = '';
        downloadBtn.style.display = 'none';

        // Using gifshot to create a GIF from the image array
        gifshot.createGIF({
            images: [imageUrl],
            gifWidth: 400,
            gifHeight: 300,
            numFrames: 1, // Single frame for conversion
            interval: 0.1
        }, function (obj) {
            loader.style.display = 'none';
            if (!obj.error) {
                const image = obj.image;
                const animatedImage = document.createElement('img');
                animatedImage.src = image;
                outputDiv.appendChild(animatedImage);

                // Setup Download
                downloadBtn.href = image;
                downloadBtn.download = "converted-image.gif";
                downloadBtn.style.display = 'inline-block';
            } else {
                alert("Error creating GIF. Check if the URL allows Cross-Origin (CORS) access.");
                console.error(obj.error);
            }
        });
    }
</script>

</body>
</html>
